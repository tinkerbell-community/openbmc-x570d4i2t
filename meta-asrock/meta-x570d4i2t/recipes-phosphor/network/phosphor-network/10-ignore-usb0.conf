# Make phosphor-network ignore usb0 (the in-band Redfish Host Interface).
# Without this, phosphor-network auto-generates /etc/systemd/network/
# 00-bmc-usb0.network (DHCP + link-local), which shadows the static
# 80-host-redfish.network (169.254.0.17) shipped by x570d4i2t-host-interface.
[Service]
Environment="IGNORED_INTERFACES=usb0"
